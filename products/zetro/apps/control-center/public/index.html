<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090a0c">
  <title>ZETRO — Control center</title>
  <link rel="stylesheet" href="/dock.css">
  <link rel="stylesheet" href="/bento.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/worker-detail/style.css">
  <link rel="stylesheet" href="/computer-preview/style.css">
  <link rel="stylesheet" href="/computer-preview/orb.css">
  <link rel="stylesheet" href="/ifz-work.css">
  <link rel="stylesheet" href="/work.css">
  <noscript>
    <link rel="stylesheet" href="/product-shell.css">
    <link rel="stylesheet" href="/ifz-work.css">
    <div id="app-root"></div>
    <script type="module" src="/product-shell.js"></script>
  </noscript>
</head>
<body>
  <div id="app-background" aria-hidden="true"></div>
  <div class="edge" aria-hidden="true"></div>
  <aside class="app-sidebar" aria-label="Side navigation placeholder">
    <div class="app-sidebar__brand">
      <span class="app-sidebar__mark" aria-hidden="true">Z</span>
      <span class="app-sidebar__identity">ZETRO<small>Workspace</small></span>
    </div>
    <div class="app-sidebar__divider"></div>
    <div class="app-sidebar__section">
      <span class="app-sidebar__eyebrow">Navigation</span>
      <div class="app-sidebar__slots" aria-hidden="true">
        <span class="app-sidebar__slot"><i></i><b></b></span>
        <span class="app-sidebar__slot"><i></i><b></b></span>
        <span class="app-sidebar__slot"><i></i><b></b></span>
      </div>
      <p class="app-sidebar__note">Your spaces and shortcuts will live here.</p>
    </div>
    <span class="app-sidebar__foot">Your space, ready to shape.</span>
  </aside>
  <button class="app-toolrail-toggle" id="app-toolrail-toggle" type="button" aria-controls="app-toolrail" aria-expanded="true" aria-label="Hide tool navigation" title="Hide tool navigation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16"/>
        <circle cx="9" cy="7" r="2" fill="#1a1d23"/>
        <circle cx="16" cy="12" r="2" fill="#1a1d23"/>
        <circle cx="11" cy="17" r="2" fill="#1a1d23"/>
      </svg>
  </button>
  <aside class="app-toolrail" id="app-toolrail" aria-label="Tool navigation placeholder">
    <span class="app-toolrail__label">Tools</span>
    <span class="app-toolrail__divider" aria-hidden="true"></span>
    <span class="app-toolrail__slots" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
    </span>
    <span class="app-toolrail__footer" aria-hidden="true">···</span>
  </aside>
  <div class="shell">
    <main id="content" tabindex="-1">
      <div class="loading">
        <span class="loading-orbit"></span>
        Reading your workspace…
      </div>
    </main>

    <footer>
      <span>
        <span class="footer-mark">Z</span>
        Built for thoughtful execution.
      </span>
      <span id="updated">Local evidence · no provider calls</span>
    </footer>
  </div>

  <!-- Primary Navigation: Floating Dock Root -->
  <div id="dock-root"></div>

  <!-- Modals & Tweaks -->
  <dialog id="worker-dialog">
    <div class="dialog-head">
      <span class="eyebrow">WORKER DETAILS</span>
      <button id="close-dialog" class="icon-button" aria-label="Close worker details">×</button>
    </div>
    <div id="worker-detail"></div>
  </dialog>

  <details class="tweak">
    <summary>
      <span data-icon="sliders"></span>
      Appearance
    </summary>
    <div class="tweak-head">
      <span>Appearance & Accent</span>
      <button type="button" class="tweak-close" id="close-tweak" aria-label="Close appearance panel">×</button>
    </div>
    <div class="tweak-body">
      <div class="tweak-row">
        <label>Accent Color</label>
        <div class="accent-chips" id="accent-chips" role="radiogroup" aria-label="Accent color selector">
          <button type="button" class="accent-chip active" data-accent="mint" title="Mint" aria-label="Mint accent" style="--chip-c: #8ce6b8"></button>
          <button type="button" class="accent-chip" data-accent="cyan" title="Cyan" aria-label="Cyan accent" style="--chip-c: #38bdf8"></button>
          <button type="button" class="accent-chip" data-accent="violet" title="Violet" aria-label="Violet accent" style="--chip-c: #a78bfa"></button>
          <button type="button" class="accent-chip" data-accent="amber" title="Amber" aria-label="Amber accent" style="--chip-c: #fbbf24"></button>
          <button type="button" class="accent-chip" data-accent="rose" title="Rose" aria-label="Rose accent" style="--chip-c: #fb7185"></button>
          <button type="button" class="accent-chip" data-accent="silver" title="Silver" aria-label="Silver accent" style="--chip-c: #e2e8f0"></button>
        </div>
      </div>
      <label>
        Spacing
        <select id="density">
          <option value="relaxed">Relaxed</option>
          <option value="compact">Compact</option>
        </select>
      </label>
      <label>
        Detail
        <select id="detail">
          <option value="focused">Focused</option>
          <option value="expanded">Expanded</option>
        </select>
      </label>
      <small>Live accent & layout controls</small>
    </div>
  </details>

  <div id="announcement" class="sr-only" aria-live="polite"></div>

  <script type="module" src="/background.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
